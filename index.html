<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Clock</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239387A9'%3E%3Cpath d='M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8s8 3.58 8 8s-3.58 8-8 8zm.5-13H11v6l5.25 3.15l.75-1.23l-4.5-2.67z' /%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-normal">
    <div class="main-container" id="fullscreen-target">
        <!-- ヘルプボタン -->
        <button id="help-btn" class="help-button" aria-label="ヘルプ">?</button>
        <!-- 時間形式切り替えボタン -->
        <button id="format-toggle" class="format-button" aria-label="時間形式切り替え">24H</button>
        <!-- 時間ソース切り替えボタン -->
        <button id="source-toggle" class="source-button" aria-label="時間ソース切り替え">INT</button>

        <!-- ヘルプモーダル -->
        <div id="help-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>使い方</h2>
                <ul>
                    <li><strong>時計エリア:</strong> クリックでフルスクリーン切り替え</li>
                    <li><strong>下のメニュー:</strong> テーマ（デザイン）の切り替え</li>
                    <li><strong>リサイズ:</strong> 画面サイズに合わせて自動調整されます</li>
                    <li><strong>時間:</strong> 時間はスマホの標準時計を使っておりますそのため電波時計などの物とずれる可能性があります</li>
                </ul>
                <button id="close-help" class="close-button">とじる</button>
            </div>
        </div>

        <!-- フルスクリーン切り替えエリア -->
        <div class="clock-section" onclick="toggleFullscreen()">
            <div id="digital-clock" class="clock-display">
                <div id="date" class="date-text"></div>
                <div id="time" class="time-text"></div>
            </div>

            <div id="analog-clock" class="clock-display" style="display: none;">
                <div class="clock-face">
                    <div id="marks-container"></div>
                    <div id="numbers-container" class="numbers"></div>
                    <div class="hand hour-hand" id="hour-hand"></div>
                    <div class="hand minute-hand" id="minute-hand"></div>
                    <div class="hand second-hand" id="second-hand"></div>
                    <div class="center-dot"></div>
                </div>
                <div id="analog-date" class="date-text"></div>
            </div>
        </div>

        <!-- スライディング・メニュー (英語ラベル版) -->
        <div class="menu-wrapper">
            <div class="nav-container">
                <div class="selection-dot"></div>
                <div class="menu-items">
                    <div class="menu-item active" data-theme="normal" data-color="#9387A9" title="Normal">
                        <span class="label">Nor</span>
                    </div>
                    <div class="menu-item" data-theme="white" data-color="#73AFCE" title="White">
                        <span class="label">Whi</span>
                    </div>
                    <div class="menu-item" data-theme="analog" data-color="#FABB74" title="Analog">
                        <span class="label">Ana</span>
                    </div>
                    <div class="menu-item" data-theme="paper" data-color="#A67C52" title="Paper">
                        <span class="label">Pap</span>
                    </div>
                    <div class="menu-item" data-theme="neon" data-color="#E16596" title="Neon">
                        <span class="label">Neo</span>
                    </div>
                    <div class="menu-item" data-theme="dark" data-color="#4A90E2" title="Dark">
                        <span class="label">Dar</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- トースト通知コンテナ -->
        <div id="toast-container" class="toast-container"></div>
    </div>
    <script src="gsap.min.js"></script>
    <script src="js/libraries.js"></script>
    <script src="script.js"></script>
</body>

</html>
